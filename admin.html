(function(){

h+='</tbody></table></div></div>';

var sorted=items.slice().sort(function(a,b){return (a.qid||"").localeCompare(b.qid||"")||(a.team||"").localeCompare(b.team||"")});
h+='<div class="sec"><h2>📝  Все ответы</h2><div class="tbl-wrap"><table><thead><tr><th>Задание</th><th>Команда</th><th>Ответ</th><th>Итог</th><th>Время</th></tr></thead><tbody>';

h+='</tbody></table></div></div>';

}

}catch(e){live.classList.add("off");live.innerHTML="<i></i> Firebase не подключён";console.error(e)}

</script>
